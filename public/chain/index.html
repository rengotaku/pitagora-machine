<style>

<body>

<div class="app">
  <main id="stage">

      <small id="loopNote">START でもう一度</small>
    </div>
  </main>
  <footer class="bar">
    <div class="brand"><b>KINETIC CHAIN No.10</b><span>28-STAGE SEQUENCE · 4 TIERS · STEEL BALL A</span></div>
    <div class="readout"><span id="timer">T+00.00 s</span><span id="now">READY</span></div>

    </div>
  </footer>
</div>

<script>
(() => {
'use strict';
// ===== SIM-BEGIN =====
// 決定論シミュレーション: DOM に触れない。固定刻み DT で進めるので何度実行しても同じ結果になる。
const W = 5600, H = 3400, G = 1500, R = 14, DT = 1 / 240, PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (u) => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

function Path(pts) {
  const s = [0]; let L = 0;
  for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); s.push(L); }
  this.p = pts; this.s = s; this.L = L;
}
Path.prototype.at = function (d) {
  const s = this.s, p = this.p; d = clamp(d, 0, this.L);
  let lo = 0, hi = s.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (s[m] <= d) lo = m; else hi = m; }
  const seg = (s[hi] - s[lo]) || 1e-9, u = (d - s[lo]) / seg;
  const ax = p[lo][0], ay = p[lo][1], bx = p[hi][0], by = p[hi][1];
  return { x: ax + (bx - ax) * u, y: ay + (by - ay) * u, tx: (bx - ax) / seg, ty: (by - ay) / seg };
};
// x が単調増加する経路で、x における y と道のり s を返す
Path.prototype.atX = function (x) {
  const p = this.p, s = this.s;
  if (x <= p[0][0]) return { y: p[0][1], s: 0 };
  for (let i = 1; i < p.length; i++) {
    if (p[i][0] >= x) { const u = (x - p[i - 1][0]) / ((p[i][0] - p[i - 1][0]) || 1e-9); return { y: lerp(p[i - 1][1], p[i][1], u), s: lerp(s[i - 1], s[i], u) }; }
  }
  return { y: p[p.length - 1][1], s: this.L };
};
function lineP(a, b, n = 1) { const o = []; for (let i = 0; i <= n; i++) { const t = i / n; o.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t)]); } return o; }
function bezP(a, b, c, d, n = 40) {
  const o = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, m = 1 - t;
    o.push([m * m * m * a[0] + 3 * m * m * t * b[0] + 3 * m * t * t * c[0] + t * t * t * d[0],
            m * m * m * a[1] + 3 * m * m * t * b[1] + 3 * m * t * t * c[1] + t * t * t * d[1]]);
  }
  return o;
}
function arcP(cx, cy, r, a0, a1, n = 24) { const o = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return o; }
function joinP(...ls) { const o = ls[0].slice(); for (let i = 1; i < ls.length; i++) o.push(...ls[i].slice(1)); return o; }
function norm(x, y) { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }
// 始点・終点・時間から初速を逆算した放物線。必ず狙った点に当たる
function ballistic(p0, p1, T) {
  const vx = (p1[0] - p0[0]) / T, vy = (p1[1] - p0[1] - .5 * G * T * T) / T;
  return { T, vx, vy, p0, p1, at: (t) => [p0[0] + vx * t, p0[1] + vy * t + .5 * G * t * t], vel: (t) => [vx, vy + G * t] };
}

const GEO = (() => {
  const g = {};
  // ---- 上段: 発射 → ピン → バンパー3連
  g.laneX = 90; g.rest = 820; g.pull = 64;
  g.pathLane = new Path(joinP(lineP([90, 820], [90, 190], 40), arcP(190, 190, 100, PI, 1.5 * PI, 24), lineP([190, 90], [300, 90], 8)));
  const C1 = [470, 112], C2 = [560, 400], C3 = [740, 300], C4 = [900, 470], L1 = [1120, 330];
  g.fl = [ballistic([300, 90], C1, .165), ballistic(C1, C2, .32), ballistic(C2, C3, .28), ballistic(C3, C4, .30), ballistic(C4, L1, Math.sqrt(2 * (C4[1] - L1[1]) / G))];
  // 衝突点の法線 = 速度変化の向き。ピンとバンパーはその法線上に置く（跳ね返り方向と装置位置が一致する）
  g.dev = [];
  for (let k = 0; k < 4; k++) {
    const f = g.fl[k], v1 = f.vel(f.T), nx = g.fl[k + 1], n = norm(nx.vx - v1[0], nx.vy - v1[1]), d = k === 0 ? 24 : 60;
    g.dev.push([f.p1[0] - d * n[0], f.p1[1] - d * n[1]]);
  }
  g.pin = g.dev[0]; g.bumpers = g.dev.slice(1);
  // ---- ループ → ジャンプ台
  g.loopC = [1500, 480]; g.loopR = 120;
  const r1a = bezP(L1, [1220, 332], [1380, 600], [1500, 600], 50);
  g.r1a = r1a;
  g.loopPts = arcP(1500, 480, 120, PI / 2, PI / 2 - TAU, 80);
  g.rampPts = bezP([1500, 600], [1700, 600], [1840, 602], [1900, 560], 40);
  g.pathRail1 = new Path(joinP(r1a, g.loopPts, g.rampPts));
  g.loopS0 = new Path(r1a).L;
  g.boost1 = [g.loopS0 - 230, g.loopS0 - 60, 2600];
  g.lip = [1900, 560]; g.catchP = [2470, 640]; g.jumpT = .8;
  g.catchPts = joinP(bezP([2470, 640], [2530, 700], [2580, 700], [2660, 700], 30), lineP([2660, 700], [2802, 700], 12));
  g.pathCatch = new Path(g.catchPts);
  // ---- ニュートンのゆりかご → 落とし戸
  g.crY = 520; g.crL = 180; g.crX = [2830, 2858, 2886, 2914, 2942];
  g.padP = [3083, 600]; g.padHitY = 651; g.padLen = 140;
  g.hinge = [2818, 714]; g.plankLen = 64; g.rodY = 740; g.rodX0 = 2748;
  // ---- 中段: ドミノ → レバー → 第2球 → 水車・歯車 → ゲート
  g.rail2Pts = joinP(bezP([2650, 880], [2690, 935], [2760, 935], [2860, 940], 30), bezP([2860, 940], [2980, 944], [3080, 1012], [3185, 1000], 40), lineP([3185, 1000], [3264, 1000], 10));
  g.pathRail2 = new Path(g.rail2Pts);
  g.floorY = 1000; g.dipX = 3215; g.dipW = 30; g.dipD = 5;
  g.platY = 1014; g.domP0 = 3290; g.domGap = 34; g.domW = 12; g.domH = 66; g.domN = 12;
  const LX = g.domP0 + (g.domN - 1) * g.domGap + 127;
  g.lev = { x: LX, y: 978, la: 82, ra: 120, b0: 0.2, b1: -0.2, t: 5 };
  g.rodBase = g.lev.y + g.lev.ra * Math.sin(g.lev.b0);
  g.stopX = LX + 118; g.stopBottom = 834;
  g.shelfX0 = LX + 45; g.shelfY = (x) => 808 + (x - g.shelfX0) * (22 / 130);
  g.bRest = [g.stopX - 21, g.shelfY(g.stopX - 21)];
  g.tubeX = LX + 213; g.elbowC = [LX + 175, 868];
  g.pathB = new Path(joinP(lineP(g.bRest, [LX + 175, 830], 12), arcP(LX + 175, 868, 38, -PI / 2, 0, 16)));
  g.wc = [LX + 165, 1170]; g.rideR = 66;
  g.landY = g.wc[1] - Math.sqrt(g.rideR * g.rideR - (g.tubeX - g.wc[0]) ** 2);
  g.aLand = Math.atan2(g.landY - g.wc[1], g.tubeX - g.wc[0]);
  g.phi0 = g.aLand + 0.22;
  g.pitch = 12; g.n1 = 27; g.n2 = 21; g.n3 = 15;
  g.r1 = g.n1 * g.pitch / TAU; g.r2 = g.n2 * g.pitch / TAU; g.r3 = g.n3 * g.pitch / TAU;
  g.a12 = Math.atan2(-52, -75); g.a23 = Math.atan2(-40, -55);
  g.g2 = [g.wc[0] + (g.r1 + g.r2) * Math.cos(g.a12), g.wc[1] + (g.r1 + g.r2) * Math.sin(g.a12)];
  g.g3 = [g.g2[0] + (g.r2 + g.r3) * Math.cos(g.a23), g.g2[1] + (g.r2 + g.r3) * Math.sin(g.a23)];
  g.rackY = g.g3[1] - g.r3; g.rackMax = 110; g.rackOpen = 44;
  g.gateX0 = 3185; g.gateW = 60;
  g.binB = [g.wc[0] + 34, 1330];
  // ---- 中段の下 → つづら折り → 下段
  g.low0 = [3150, 1390]; g.low1 = [4900, 1480]; g.lowLen = Math.hypot(1750, 90);
  // 戻り直線の途中に水切りプール。lip で水面へ飛び出し、touch の各点で跳ね、glide で水面を滑って land からレールへ戻る
  g.pool = { x0: 3640, x1: 4800, top: 1930, bot: 2012, lip: 4770, land: 3700, touch: [4610, 4415, 4250, 4115, 4005, 3915], glide: 3800, hs: [8, 42, 30, 20, 12, 6, 0, 14] };
  g.t3Y = (x) => 1900 - (5400 - x) * 10 / 2405;
  g.sbParts = {
    s1: lineP([4900, 1480], [5400, 1540], 30), a1: arcP(5400, 1580, 40, -PI / 2, PI / 2, 20),
    s2: lineP([5400, 1620], [4950, 1680], 30), a2: arcP(4950, 1720, 40, -PI / 2, -1.5 * PI, 20),
    s3: lineP([4950, 1760], [5400, 1820], 30), a3: arcP(5400, 1860, 40, -PI / 2, PI / 2, 20),
    t3: lineP([5400, 1900], [g.pool.lip, g.t3Y(g.pool.lip)], 32)
  };
  const sp = g.sbParts;
  g.pathLow = new Path(joinP(lineP(g.low0, g.low1, 80), sp.s1, sp.a1, sp.s2, sp.a2, sp.s3, sp.a3, sp.t3));
  g.sbS0 = g.lowLen;
  g.pathLow2 = new Path(lineP([g.pool.land, g.t3Y(g.pool.land)], [2995, 1890], 36));
  g.boost2 = [160, 420, 2600];
  g.cupX = 2965; g.cupY = 1890; g.cupW = 34; g.cupD = 14;
  g.ham = { x: 3000, y: 1500, L: 380, psi0: 1.2, hw: 32 };
  g.hitPsi = Math.asin((g.cupX + R + g.ham.hw - g.ham.x) / g.ham.L);
  g.t3End = [1380, 1935];
  g.pathT3 = new Path(joinP(lineP([2965, 1904], [2930, 1890], 4), lineP([2930, 1890], g.t3End, 130)));
  g.t3y = (x) => 1890 + (2930 - x) * (45 / 1550);
  g.boost3 = [1120, 1300, 2600];
  g.xylo = []; for (let k = 0; k < 8; k++) g.xylo.push(2700 - k * 100);
  // ---- 4段目: らせん → 3分裂 → 待機 → 1球選抜 → 大ループ → ゴール
  g.hel = { x: 1380, y0: 1935, r: 120, c: 130 / TAU, th0: PI / 2, turns: 4.5 };
  g.hel.L1 = Math.hypot(g.hel.r, g.hel.c); g.hel.len = g.hel.turns * TAU * g.hel.L1;
  g.helEnd = [1380, g.hel.y0 + g.hel.c * g.hel.turns * TAU];
  g.hsPts = bezP(g.helEnd, [1520, g.helEnd[1]], [1720, 2600], [1850, 2600], 30);
  g.pathHS = new Path(g.hsPts);
  g.split = [1850, 2600];
  g.mLoopsX = [2450, 2750, 3050];
  g.mPre = joinP(lineP([1850, 2600], [1900, 2600], 4), bezP([1900, 2600], [2100, 2600], [2300, 2700], [2450, 2700], 30));
  g.mLoops = g.mLoopsX.map(x => arcP(x, 2600, 100, PI / 2, PI / 2 - TAU, 64));
  g.mMid = [lineP([2450, 2700], [2750, 2700], 10), lineP([2750, 2700], [3050, 2700], 10)];
  g.mPost = bezP([3050, 2700], [3300, 2700], [3500, 2730], [3740, 2730], 30);
  g.pathM = new Path(joinP(g.mPre, g.mLoops[0], g.mMid[0], g.mLoops[1], g.mMid[1], g.mLoops[2], g.mPost));
  g.mLoopS0 = new Path(g.mPre).L; g.boostM = [60, 300, 3200];
  g.laneTPts = joinP(lineP([1850, 2600], [1900, 2600], 4), bezP([1900, 2600], [2000, 2600], [2120, 2560], [2200, 2480], 30));
  g.pathT = new Path(g.laneTPts); g.boostT = [10, 150, 6000];
  g.tJump = ballistic([2200, 2480], [3350, 2470], 1.25);
  g.hoops = [.3, .62, .95].map(f => { const t = g.tJump.T * f, p = g.tJump.at(t), v = g.tJump.vel(t); return { x: p[0], y: p[1], a: Math.atan2(v[1], v[0]), t }; });
  g.catchTPts = joinP(bezP([3350, 2470], [3420, 2520], [3500, 2575], [3600, 2575], 30), lineP([3600, 2575], [3740, 2575], 10));
  g.pathCT = new Path(g.catchTPts);
  g.laneBPts = joinP(lineP([1850, 2600], [1900, 2600], 4), bezP([1900, 2600], [1950, 2600], [1985, 2650], [2000, 2700], 20));
  g.pathLB = new Path(g.laneBPts);
  g.pach = []; { let p0 = [2000, 2700]; for (const [x, y, T] of [[2090, 2790, .2], [2210, 2860, .26], [2340, 2880, .24], [2470, 2940, .26], [2610, 2960, .24], [2760, 3010, .28], [2900, 3040, .22]]) { g.pach.push(ballistic(p0, [x, y], T)); p0 = [x, y]; } }
  g.pins = []; for (let k = 0; k < 6; k++) { const f = g.pach[k], v1 = f.vel(f.T), nx = g.pach[k + 1], n = norm(nx.vx - v1[0], nx.vy - v1[1]); g.pins.push([f.p1[0] - 22 * n[0], f.p1[1] - 22 * n[1]]); }
  g.railBPts = joinP(bezP([2900, 3040], [3100, 3045], [3400, 3000], [3550, 2900], 40), lineP([3550, 2900], [3740, 2885], 10));
  g.pathRB = new Path(g.railBPts); g.boostB = [40, 260, 3000];
  g.pocketX = 3760; g.pocketY = [2575, 2730, 2885];
  g.F = [4150, 2730];
  g.conv = [new Path(bezP([3760, 2575], [3950, 2575], [4000, 2730], g.F, 30)), new Path(lineP([3760, 2730], g.F, 20)), new Path(bezP([3760, 2885], [3950, 2885], [4000, 2730], g.F, 30))];
  g.fPre = bezP(g.F, [4300, 2730], [4400, 2780], [4500, 2780], 30);
  g.fLoop = arcP(4500, 2630, 150, PI / 2, PI / 2 - TAU, 90);
  g.fRamp = bezP([4500, 2780], [4650, 2780], [4740, 2760], [4800, 2700], 30);
  g.pathF = new Path(joinP(g.fPre, g.fLoop, g.fRamp)); g.fLoopS0 = new Path(g.fPre).L; g.boostF = [20, 200, 2600];
  // ---- 4段目の底: 高速バウンス（トランポリン3台・天井プレート・側壁）→ ダッシュ直線 → バネ → 重力装置 → ゴール
  g.trY = 3130; g.trX = [5250, 4600, 3950];
  const tb = (x) => [x, g.trY - R];
  g.fJump = ballistic([4800, 2700], tb(g.trX[0]), .9);
  { const t = g.fJump.T * .3, p = g.fJump.at(t), v = g.fJump.vel(t); g.fHoop = { x: p[0], y: p[1], a: Math.atan2(v[1], v[0]), t }; }
  // 床・側壁・天井を短い直線的な弾道で跳ね回る。hit は各弾道の終点で叩く装置
  g.ceilY = 2900; g.wallX = 5430;

  const V = g.grav, k = .12 + .88 * sim.grav.k, gf = fx.flash.grav || 0, lensY = V.lens, bot = 3225;
  ctx.fillStyle = steelGrad(0, V.y0 - 22, 0, V.y0, true); ctx.fillRect(250, V.y0 - 22, 440, 18);
  const cone = ctx.createLinearGradient(0, lensY, 0, bot);
  cone.addColorStop(0, `rgba(190,160,255,${.32 * k})`); cone.addColorStop(1, `rgba(190,160,255,${.04 * k})`);
  ctx.fillStyle = cone; ctx.beginPath(); ctx.moveTo(V.x - 62, lensY); ctx.lineTo(V.x + 62, lensY); ctx.lineTo(V.x + 150, bot); ctx.lineTo(V.x - 150, bot); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 2;
  for (let j = 0; j < 4; j++) {
    const ph = (t * .7 + j / 4) % 1, y = lerp(bot - 20, lensY + 20, ph), rx = lerp(150, 62, ph);
    ctx.strokeStyle = `rgba(210,190,255,${.55 * k * Math.sin(PI * ph)})`; ctx.beginPath(); ctx.ellipse(V.x, y, rx, rx * .18, 0, 0, TAU); ctx.stroke();
  }
  for (let j = 0; j < 16; j++) {
    const ph = (t * (.35 + (j % 5) * .06) + j / 16) % 1, y = lerp(bot, lensY + 10, ph), w = lerp(150, 62, ph) * .85;
    ctx.fillStyle = `rgba(230,215,255,${.8 * k * Math.sin(PI * ph)})`; circ(V.x + Math.sin(j * 2.4 + t * 1.3) * w, y, 2.2); ctx.fill();
  }
  ctx.fillStyle = steelGrad(0, 3222, 0, 3232, true); ctx.fillRect(476, 3222, 226, 9);
  for (const d of fx.debris) { const h = clamp((d.rest - d.y) / d.lift, 0, 1); ctx.save(); ctx.translate(d.x + (V.x - d.x) * .3 * h, d.y); ctx.rotate(d.rot); drawDebris(d); ctx.restore(); }
  ctx.fillStyle = steelGrad(V.x - 70, V.y0, V.x + 70, V.y0 + 50); ctx.beginPath(); ctx.moveTo(V.x - 40, V.y0 - 4); ctx.lineTo(V.x + 40, V.y0 - 4); ctx.lineTo(V.x + 72, lensY - 6); ctx.lineTo(V.x - 72, lensY - 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(${200 + 55 * gf},${180 + 75 * gf},255,${.5 + .5 * k})`; ctx.beginPath(); ctx.ellipse(V.x, lensY - 2, 64, 9, 0, 0, TAU); ctx.fill();
  glow(V.x, lensY + 10, 140, '190,160,255', .25 * k + .6 * gf);
  if (sim.A.phase === 'grav') glow(sim.A.x, sim.A.y, 70, '200,180,255', .7 * sim.grav.k);
  txt('GRAVITY', V.x - 150, V.y0 - 34, '700 20px "Saira Condensed", sans-serif', 'rgba(200,185,255,.55)', 'center');
}

function drawTier4Front(now) {
  const g = GEO, t = now / 1000;
  HELIX.filter(r => r.f).forEach(r => rail(r.pts));
  g.hoops.forEach((hp, i) => hoopHalf(hp, true, fx.flash['hoop' + i] || 0, now)); hoopHalf(g.fHoop, true, fx.flash.hoop3 || 0, now);
  const ff = fx.flash.fuse || 0; if (ff > .02) glow(g.F[0], g.F[1], 260, '200,235,255', ff);
}

function drawBalls() {
  const A = sim.A, B = sim.B;
  drawBall(B.x, B.y, R, B.spin, 'copper');
  sim.C.forEach(c => { if (c.vis) { glow(c.x, c.y, 40, '140,210,255', .5); drawBall(c.x, c.y, R, c.spin, 'steel'); } });
  if (A.vis && A.energy) glow(A.x, A.y, 40, '140,210,255', .5);
  if (A.vis) {
    const sp = Math.hypot(A.vx, A.vy);
    if (sp > 600) {
      // 速度線
      const [ux, uy] = norm(A.vx, A.vy), len = clamp((sp - 600) * .25, 0, 200);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = -2; i <= 2; i++) {
        const ox = -uy * i * 6, oy = ux * i * 6, l = len * (1 - Math.abs(i) * .22);
        const gr = ctx.createLinearGradient(A.x + ox, A.y + oy, A.x + ox - ux * l, A.y + oy - uy * l);
        gr.addColorStop(0, 'rgba(255,220,170,.55)'); gr.addColorStop(1, 'rgba(255,220,170,0)');
        ctx.strokeStyle = gr; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(A.x + ox, A.y + oy); ctx.lineTo(A.x + ox - ux * l, A.y + oy - uy * l); ctx.stroke();
      }
      ctx.restore();
    }
    fx.trail.forEach((p, i) => { const a = (i + 1) / fx.trail.length * .22; ctx.fillStyle = `rgba(210,222,235,${a})`; circ(p[0], p[1], R * .92 * A.scale); ctx.fill(); });
    drawBall(A.x, A.y, R * A.scale, A.spin, 'steel', A.dark);
    if (sp > 1000) glow(A.x, A.y, 46, '255,190,120', clamp((sp - 1000) / 600, 0, .6));
  }
}
function drawMinimap(now) {
  const mw = Math.min(280, cw * .34), mh = mw * H / W, pad = 12, x0 = cw - mw - pad, y0 = pad, s = mw / W;
  ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgba(8,9,11,.78)'; rr(x0 - 6, y0 - 6, mw + 12, mh + 26, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(120,135,150,.35)'; ctx.lineWidth = 1; ctx.stroke();
  const tr = TRACK.a, t = sim.started ? (sim.done ? sim.endT : sim.t) : 0;
  ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(160,172,184,.35)'; ctx.beginPath();
  tr.forEach((p, i) => { const X = x0 + p[0] * s, Y = y0 + p[1] * s; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke();
  ctx.strokeStyle = '#f2a33a'; ctx.lineWidth = 2; ctx.beginPath(); let first = true;
  for (const p of tr) { if (p[2] > t) break; const X = x0 + p[0] * s, Y = y0 + p[1] * s; first ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y); first = false; } ctx.stroke();
  TRACK.c.forEach(tc => { ctx.strokeStyle = 'rgba(140,210,255,.75)'; ctx.lineWidth = 1.2; ctx.beginPath(); let f2 = true; for (const p of tc) { if (p[2] > t) break; const X = x0 + p[0] * s, Y = y0 + p[1] * s; f2 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y); f2 = false; } ctx.stroke(); });
  sim.C.forEach(c => { if (c.vis) { ctx.fillStyle = '#bfe4ff'; circ(x0 + c.x * s, y0 + c.y * s, 2.6); ctx.fill(); } });
  ctx.strokeStyle = 'rgba(255,160,110,.7)'; ctx.lineWidth = 1.2; ctx.beginPath(); first = true;
  for (const p of TRACK.b) { if (p[2] > t) break; const X = x0 + p[0] * s, Y = y0 + p[1] * s; first ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y); first = false; } ctx.stroke();
  TAGS.forEach(([x, y], i) => { ctx.fillStyle = sim.stageT[i + 1] != null ? '#f2a33a' : 'rgba(120,135,150,.6)'; circ(x0 + x * s, y0 + y * s, 1.8); ctx.fill(); });
  if (sim.A.vis) { ctx.fillStyle = '#fff'; circ(x0 + sim.A.x * s, y0 + sim.A.y * s, 3.2); ctx.fill(); }
  ctx.fillStyle = '#ffb27a'; circ(x0 + sim.B.x * s, y0 + sim.B.y * s, 2.2); ctx.fill();
  const v = viewRect; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
  ctx.strokeRect(x0 + Math.max(0, v[0]) * s, y0 + Math.max(0, v[1]) * s, (Math.min(W, v[2]) - Math.max(0, v[0])) * s, (Math.min(H, v[3]) - Math.max(0, v[1])) * s);
  ctx.font = '600 9px "Martian Mono", monospace'; ctx.fillStyle = 'rgba(160,172,184,.8)';
  ctx.fillText('MAP · ' + String(sim.nDone).padStart(2, '0') + '/' + NST, x0, y0 + mh + 14);
  ctx.restore();
}

let cw = 0, ch = 0, dpr = 1, viewRect = [0, 0, W, H];
// 拡大中に画面外の装置を描かないための外接矩形。1 周分の描画座標を実測した範囲に 80 の余白を足してある
// （装置の位置や動く範囲を変えたら測り直す）
const CULL = Object.fromEntries(Object.entries({
  nameplate: [270, 1056, 800, 1266], dial: [1042, 1032, 1464, 1457], funnel: [168, 3014, 492, 3326], lane: [20, 72, 300, 968],
  tier1: [1119, 343, 2802, 717], pins: [372, 91, 1011, 594], cradle: [2697, 374, 3128, 773], tier2: [2637, 890, 3187, 1044],
  gears: [3793, 1045, 4036, 1346], gate: [3175, 978, 3966, 1057], lever: [3712, 742, 4021, 1098], dominoes: [3278, 947, 3724, 1004],
  low: [1380, 1332, 5457, 2030], hammer: [2580, 1080, 3456, 1920], tier4: [1242, 1821, 5250, 3138], run: [250, 2136, 5468, 3355], tier4f: [1260, 1952, 5025, 2810], pool: [3600, 1870, 4840, 2075]
}).map(([k, b]) => [k, [b[0] - 80, b[1] - 80, b[2] + 80, b[3] + 80]]));
function resize() {
  const r = cv.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = r.width; ch = r.height; cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
}
function render(now) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#08090b'; ctx.fillRect(0, 0, cv.width, cv.height);
  const vh = cam.v * (1 - .07 * Math.min(1, fx.punch));
  const s = Math.min(ch / vh, cw / (vh * 16 / 9));
  const hw = cw / (2 * s), hh = ch / (2 * s);
  const cx = hw * 2 >= W ? W / 2 : clamp(cam.x, hw, W - hw), cy = hh * 2 >= H ? H / 2 : clamp(cam.y, hh, H - hh);
  const sk = reduced ? 0 : fx.shake, t = now / 1000;
  const sx = (Math.sin(t * 73) + Math.sin(t * 131) * .5) * sk, sy = (Math.cos(t * 61) + Math.cos(t * 117) * .5) * sk;
  const rot = reduced ? 0 : Math.sin(t * 47) * sk * .0009;
  viewRect = [cx - hw, cy - hh, cx + hw, cy + hh];
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (cw / 2 - (cx - sx) * s), dpr * (ch / 2 - (cy - sy) * s));
  if (rot) { ctx.translate(cx, cy); ctx.rotate(rot); ctx.translate(-cx, -cy); }
  drawBackplate(viewRect, cx, cy, now / 1000);
  drawAmbient(now / 1000, now, viewRect);
  const on = (k) => { const b = CULL[k]; return b[2] >= viewRect[0] && b[0] <= viewRect[2] && b[3] >= viewRect[1] && b[1] <= viewRect[3]; };
  if (on('nameplate')) drawNameplate(); if (on('dial')) drawDial();
  if (on('funnel')) drawFunnelBack();
  if (on('lane')) drawLane(); if (on('tier1')) drawTier1(); if (on('pins')) drawPinsAndBumpers(); if (on('cradle')) drawCradle();
  if (on('tier2')) drawTier2Rails(); if (on('gears')) drawGearsAndWheel(); if (on('gate')) drawPlatformAndGate(); if (on('lever')) drawLeverRodShelf(); if (on('dominoes')) drawDominoes();
  if (on('low')) drawLowRails(); if (on('pool')) drawPoolBack(now); if (on('hammer')) drawHammer(); if (on('tier4')) drawTier4Back(now);
  drawBalls();
  if (on('pool')) drawPoolFront(now);
  if (on('run')) drawRunZone(now);
  if (on('tier4f')) drawTier4Front(now);
  if (on('funnel')) drawFunnelFront(now);
  drawFx(); drawTags(now);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const v = ctx.createRadialGradient(cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * .35, cv.width / 2, cv.height / 2, Math.max(cv.width, cv.height) * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, cv.width, cv.height);
  if (fx.white > .01 && !reduced) { ctx.fillStyle = `rgba(255,244,228,${fx.white * .55})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (cam.v < OVER.v * .8) drawMinimap(now);
}

// ---- UI
const lampsEl = document.getElementById('lamps'), timerEl = document.getElementById('timer'), nowEl = document.getElementById('now');
const btnStart = document.getElementById('btnStart'), btnReset = document.getElementById('btnReset'), btnSound = document.getElementById('btnSound');
const banner = document.getElementById('banner'), bannerText = document.getElementById('bannerText'), hint = document.getElementById('hint');
lampsEl.innerHTML = STAGES.map(([en, jp], i) => `<li role="button" tabindex="0" title="${jp}（クリックでここから再生）">${String(i + 1).padStart(2, '0')}</li>`).join('');
const lampEls = [...lampsEl.children];
let lastStage = -1, lastDone = null;
function updateUI(now) {
  const tm = sim.started ? (sim.done ? sim.endT : sim.t) : 0;
  timerEl.textContent = 'T+' + tm.toFixed(2).padStart(5, '0') + ' s';
  if (sim.nDone !== lastStage) {
    lastStage = sim.nDone; const nx = nextStage();
    lampEls.forEach((li, i) => { li.classList.toggle('on', sim.stageT[i + 1] != null); li.classList.toggle('next', i + 1 === nx && !sim.done); });
    nowEl.textContent = sim.nDone ? `NOW ${String(sim.stage).padStart(2, '0')} ${STAGES[sim.stage - 1][1]}` : 'READY';
  }
  const showBanner = sim.done && now - fx.goalT > 900;
  if (showBanner) loopNote.textContent = loopOn ? `${Math.max(0, Math.ceil((LOOP_MS - (now - fx.goalT)) / 1000))} 秒後にもう一周（LOOP ON）` : 'START でもう一度';
  if (banner.hidden === showBanner) { banner.hidden = !showBanner; if (showBanner) bannerText.textContent = `${NST} / ${NST} STAGES · ${sim.endT.toFixed(2)} s`; }
  if (lastDone !== sim.done) { lastDone = sim.done; btnStart.classList.toggle('again', sim.done); btnStart.textContent = sim.done ? 'START AGAIN' : 'START'; }
  btnStart.disabled = sim.started && !sim.done;
  hint.hidden = sim.started;
}
let runNo = 0, loopOn = true, labelsOn = true;
function nextStage() { for (let k = 1; k <= NST; k++) if (sim.stageT[k] == null) return k; return 0; }
const btnLabel = document.getElementById('btnLabel');
try { if (localStorage.getItem('chain10.labels') === 'off') labelsOn = false; } catch (e) {}
const syncLabel = () => { btnLabel.textContent = labelsOn ? 'No. ON' : 'No. OFF'; btnLabel.setAttribute('aria-pressed', String(labelsOn)); };
syncLabel();
btnLabel.addEventListener('click', () => { labelsOn = !labelsOn; syncLabel(); try { localStorage.setItem('chain10.labels', labelsOn ? 'on' : 'off'); } catch (e) {} });
const btnLoop = document.getElementById('btnLoop'), loopNote = document.getElementById('loopNote');
btnLoop.addEventListener('click', () => { loopOn = !loopOn; btnLoop.textContent = loopOn ? 'LOOP ON' : 'LOOP OFF'; btnLoop.setAttribute('aria-pressed', String(loopOn)); });
function doReset() { sndTimers.forEach(clearTimeout); sndTimers.clear(); sim.reset(); fx.reset(); acc = 0; ts = 1; Snd.setRoll(0, 0); lastStage = -1; lastDone = null; }
function doStart() { Snd.init(); if (sim.done) doReset(); if (sim.started) return; runNo++; sim.start(); }
// 指定した段の少し手前まで、演出なしで計算だけ早送りしてから再生する（同じ計算なので通しで見たときと同じ動きになる）
const JUMP_LEAD = 1.2;
function jumpTo(k) {
  const st = TRACK.stageT[k]; if (!Number.isFinite(st)) return;
  Snd.init(); doReset(); runNo++; sim.start();
  const tgt = Math.max(0, st - JUMP_LEAD);
  while (sim.t < tgt && !sim.done) { sim.step(DT); sim.ev.length = 0; }
  fx.dial = sim.nDone; fx.dialV = 0;
  const c = camTarget(performance.now()); cam.x = c.x; cam.y = c.y; cam.v = c.v; cam.vx = cam.vy = cam.vv = 0;
}
lampsEl.addEventListener('click', (e) => { const li = e.target.closest('li'); if (li) jumpTo(lampEls.indexOf(li) + 1); });
lampsEl.addEventListener('keydown', (e) => { const li = e.target.closest('li'); if (li && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); jumpTo(lampEls.indexOf(li) + 1); } });
btnStart.addEventListener('click', doStart);
btnReset.addEventListener('click', doReset);
btnSound.addEventListener('click', () => {
  const on = !Snd.on; Snd.setOn(on); btnSound.textContent = on ? 'SOUND ON' : 'SOUND OFF'; btnSound.setAttribute('aria-pressed', String(on));
});
window.addEventListener('keydown', (e) => {
  if ((e.target.tagName === 'BUTTON' || e.target.tagName === 'LI') && (e.code === 'Space' || e.code === 'Enter')) return;
  if (e.code === 'Space') { e.preventDefault(); doStart(); } else if (e.key === 'r' || e.key === 'R') doReset(); else if (e.key === 'n' || e.key === 'N') btnLabel.click();
});
document.addEventListener('visibilitychange', () => { if (Snd.ctx) { if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume(); } });
window.addEventListener('resize', resize);
resize();

// ---- メインループ: 実時間 × 時間倍率 だけシミュレーションを固定刻みで進める
const LOOP_MS = 6500;
let last = performance.now(), acc = 0, ts = 1, lastTooth = null;
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  const target = fx.slowUntil > now ? fx.slowF : 1;
  ts += (target - ts) * (1 - Math.exp(-rdt * 7));
  acc += rdt * ts; let n = 0;
  while (acc >= DT && n < 80) { sim.step(DT); acc -= DT; n++; }
  for (const e of sim.ev) onEvent(e); sim.ev.length = 0;
  const tooth = Math.floor(gearAngles(sim.wh.phi)[2] / (TAU / GEO.n3));
  if (lastTooth !== null && tooth !== lastTooth && sim.wh.w > 0) Snd.noise(.012, 5200, 3, .16);
  lastTooth = tooth;
  const A = sim.A, sp = A.phase === 'spiral' ? sim.fun.w * sim.fun.r : Math.hypot(A.vx, A.vy);
  Snd.setRoll((A.onRail || A.phase === 'spiral' || sim.B.phase === 'roll') ? clamp(sp / 900, 0, 1) * .38 : 0, sp);
  // レールとの摩擦火花: 速いほど多く、進行方向の後ろへ散る
  if (A.onRail && sp > 520 && !reduced) {
    const n = Math.min(6, Math.floor((sp - 520) / 140 * rdt * 60 + fx.rng()));
    const back = Math.atan2(-A.vy, -A.vx), cx = A.x - (A.ty || 0) * 0 , cy = A.y + R;
    fx.spark(cx, cy, n, sp * .45, sp > 1000 ? '255,236,200' : '255,184,92', 60, back, 1.1);
  }
  { const P = GEO.pool; if (fx.rng() < rdt * 5) fx.bubbles.push({ x: P.x0 + 20 + fx.rng() * (P.x1 - P.x0 - 40), y: P.bot - 6, r: 1.5 + fx.rng() * 3, life: 0, max: 2 + fx.rng() });
    if (A.phase === 'skim' && !reduced) { if (A.y > P.top - R - 2) fx.spark(A.x + 8, P.top - 2, 3, Math.min(900, Math.abs(A.vx) * .55), '190,230,255', 120, -PI * .32, .7); if (fx.wake) fx.wake.x1 = Math.min(fx.wake.x1, A.x); } }
  { const fdt = rdt * ts;
    fx.debris.forEach((d, i) => {
      if (sim.grav.on) { const tgt = d.rest - d.lift + 12 * Math.sin(now / 600 + i * 1.7); d.vy = (tgt - d.y) * 1.6; d.y += d.vy * fdt; d.rot += d.w * fdt; }
      else if (d.y < d.rest || d.vy !== 0) { d.vy += 1500 * fdt; d.y += d.vy * fdt; d.rot += d.w * .5 * fdt; if (d.y >= d.rest) { d.y = d.rest; if (d.vy > 220) Snd.metal(1700 + i * 140, .07, .2); d.vy = d.vy > 80 ? -d.vy * .3 : 0; } }
    }); }
  for (const c of sim.C) if (c.onRail && !reduced) { const v = Math.hypot(c.vx, c.vy); if (v > 520) fx.spark(c.x, c.y + R, Math.min(4, Math.floor((v - 520) / 200 * rdt * 60 + fx.rng())), v * .4, '170,220,255', 60, Math.atan2(-c.vy, -c.vx), 1.1); }
  if (A.phase === 'spiral' && sp > 500 && !reduced && fx.rng() < .5) fx.spark(A.x, A.y + R * .6, 2, sp * .3, '255,184,92', 40);
  if (A.vis && sim.started && sp > 300 && A.phase !== 'settle' && A.phase !== 'cup') { fx.trail.push([A.x, A.y]); if (fx.trail.length > 16) fx.trail.shift(); }
  else if (fx.trail.length) fx.trail.shift();
  if (loopOn && sim.done && fx.goalT > 0 && now - fx.goalT > LOOP_MS) { doReset(); doStart(); }
  fx.update(rdt * ts);
  camUpdate(rdt, camTarget(now));
  render(now);
  updateUI(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
